# Monthly, grouped dependency updates: one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      javascript:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
